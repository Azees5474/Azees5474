<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 395" width="100%" height="auto" role="img" aria-label="The tools I reach for — Technical Skills Matrix">
  <defs>
    <!-- Background Gradient: Rich Dark Shade of Burgundy -->
    <linearGradient id="tool-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140510"/>
      <stop offset="35%" stop-color="#230A1B"/>
      <stop offset="65%" stop-color="#2D0D22"/>
      <stop offset="100%" stop-color="#160512"/>
    </linearGradient>

    <!-- Glowing Outer Border Gradient -->
    <linearGradient id="tool-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E1B54" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#451126" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#C77B9B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Box Background: Distinct Dark Shade of Burgundy -->
    <linearGradient id="box-burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B0D1E"/>
      <stop offset="100%" stop-color="#200816"/>
    </linearGradient>

    <!-- Box Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B54" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5A122E" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Bottom Neon Underglow Gradient (As Seen in Attached Photo) -->
    <radialGradient id="tool-underglow" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#A81D58" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#3D0B20" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#140510" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="tool-ambient-glow" cx="40%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5A122E" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#350E22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#140510" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Scanning Laser -->
    <linearGradient id="tool-top-scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1">
        <animate attributeName="offset" values="-0.5; 1.0" dur="4.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#9E1B54" stop-opacity="0.7">
        <animate attributeName="offset" values="-0.2; 1.3" dur="4.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95">
        <animate attributeName="offset" values="0.0; 1.5" dur="4.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0.2; 1.7" dur="4.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1">
        <animate attributeName="offset" values="0.5; 2.0" dur="4.2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="tool-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#701A3D" opacity="0.35"/>
    </pattern>

    <!-- Underglow Blur Filter -->
    <filter id="tool-ground-blur" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <style>
    .k-mono {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
    }
    .k-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .k-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
    }
    .c-head {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      fill: #E5B5C7;
      letter-spacing: 1.5px;
    }
    .c-item {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #F8F0F3;
    }
    .c-sub {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      fill: #C77B9B;
      letter-spacing: 0.8px;
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform {
        animation: none !important;
      }
    }
  </style>

  <!-- 0. Radiant Neon Underglow (Spills Downward Like Attached Photo) -->
  <g transform="translate(470, 370)" filter="url(#tool-ground-blur)">
    <ellipse cx="0" cy="0" rx="420" ry="20" fill="url(#tool-underglow)">
      <animate attributeName="rx" values="390; 440; 390" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7; 1.0; 0.7" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 1. Background Shell (Rich Dark Burgundy) -->
  <rect width="940" height="370" rx="14" fill="url(#tool-bg)"/>
  <rect width="940" height="370" rx="14" fill="url(#tool-ambient-glow)">
    <animate attributeName="opacity" values="0.6;0.95;0.6" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="936" height="366" rx="12" fill="url(#tool-grid)" opacity="0.5"/>

  <!-- Top Laser Scanner Line -->
  <line x1="20" y1="2" x2="920" y2="2" stroke="url(#tool-top-scan)" stroke-width="2" stroke-linecap="round"/>

  <!-- 2. Top Title Strip with Rotating Technical Reticle -->
  <g transform="translate(26, 26)">
    <text class="k-mono" font-size="9.5" font-weight="700" fill="#C77B9B" letter-spacing="2">
      03 · TOOLKIT MATRIX
    </text>
    <text y="24" class="k-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
      The tools I reach for.
    </text>

    <!-- Rotating Tech Compass / Reticle in Top-Right -->
    <g transform="translate(868, 12)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#451126" stroke-width="1" stroke-dasharray="2 3"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#9E1B54" stroke-width="1.2" stroke-dasharray="6 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2.5" fill="#C77B9B"/>
    </g>
  </g>

  <!-- 3. 6-Card Grid: Row 1 (Boxes with Dark Burgundy Backgrounds & Breathing Borders) -->
  <g transform="translate(26, 84)">
    <!-- Box 1: 01 LANGUAGES -->
    <g transform="translate(0, 0)">
      <rect width="284" height="126" rx="8" fill="url(#box-burgundy)" stroke="url(#card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#C77B9B;#9E1B54" dur="4s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Beacon -->
      <circle cx="16" cy="18" r="3" fill="#C77B9B">
        <animate attributeName="r" values="2.4; 3.6; 2.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="c-head">01 · LANGUAGES</text>
      <text x="16" y="46" class="c-item">JavaScript (ES6+) · TypeScript</text>
      <text x="16" y="66" class="c-item">Python · C++ (Embedded)</text>
      <text x="16" y="86" class="c-item">SQL (PostgreSQL) · HTML5 / CSS3</text>
      <line x1="16" y1="98" x2="268" y2="98" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="112" class="c-sub">FULL-STACK &amp; EMBEDDED FOUNDATION</text>
    </g>

    <!-- Box 2: 02 FRONTEND & UI -->
    <g transform="translate(302, 0)">
      <rect width="284" height="126" rx="8" fill="url(#box-burgundy)" stroke="url(#card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#E5B5C7;#9E1B54" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Beacon -->
      <circle cx="16" cy="18" r="3" fill="#E5B5C7">
        <animate attributeName="r" values="2.4; 3.6; 2.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="c-head">02 · FRONTEND &amp; UI</text>
      <text x="16" y="46" class="c-item">React · Vite · Component Design</text>
      <text x="16" y="66" class="c-item">Responsive UI · CSS Grid &amp; Flexbox</text>
      <text x="16" y="86" class="c-item">Streamlit · Web Accessibility</text>
      <line x1="16" y1="98" x2="268" y2="98" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="112" class="c-sub">MODERN INTERACTIVE INTERFACES</text>
    </g>

    <!-- Box 3: 03 DESKTOP & BACKEND -->
    <g transform="translate(604, 0)">
      <rect width="284" height="126" rx="8" fill="url(#box-burgundy)" stroke="url(#card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#C77B9B;#9E1B54" dur="5.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Beacon -->
      <circle cx="16" cy="18" r="3" fill="#C77B9B">
        <animate attributeName="r" values="2.4; 3.6; 2.4" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="c-head">03 · DESKTOP &amp; BACKEND</text>
      <text x="16" y="46" class="c-item">Electron · Desktop Packaging</text>
      <text x="16" y="66" class="c-item">Node.js · Express.js</text>
      <text x="16" y="86" class="c-item">RESTful APIs · Offline Storage</text>
      <line x1="16" y1="98" x2="268" y2="98" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="112" class="c-sub">OFFLINE-FIRST DESKTOP RUNTIMES</text>
    </g>
  </g>

  <!-- 4. 6-Card Grid: Row 2 (Boxes with Dark Burgundy Backgrounds & Breathing Borders) -->
  <g transform="translate(26, 224)">
    <!-- Box 4: 04 AI & DATA -->
    <g transform="translate(0, 0)">
      <rect width="284" height="126" rx="8" fill="url(#box-burgundy)" stroke="url(#card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#E5B5C7;#9E1B54" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Beacon -->
      <circle cx="16" cy="18" r="3" fill="#E5B5C7">
        <animate attributeName="r" values="2.4; 3.6; 2.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="c-head">04 · AI &amp; VECTOR DATA</text>
      <text x="16" y="46" class="c-item">LangChain · RAG Pipelines</text>
      <text x="16" y="66" class="c-item">ChromaDB · Vector Embeddings</text>
      <text x="16" y="86" class="c-item">PostgreSQL · SQLite</text>
      <line x1="16" y1="98" x2="268" y2="98" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="112" class="c-sub">RETRIEVAL AUGMENTED GENERATION</text>
    </g>

    <!-- Box 5: 05 IOT & EMBEDDED -->
    <g transform="translate(302, 0)">
      <rect width="284" height="126" rx="8" fill="url(#box-burgundy)" stroke="url(#card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#C77B9B;#9E1B54" dur="5.0s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Beacon -->
      <circle cx="16" cy="18" r="3" fill="#C77B9B">
        <animate attributeName="r" values="2.4; 3.6; 2.4" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="c-head">05 · IOT &amp; HARDWARE</text>
      <text x="16" y="46" class="c-item">ESP32 Microcontrollers</text>
      <text x="16" y="66" class="c-item">Live GPS Telemetry Streams</text>
      <text x="16" y="86" class="c-item">Geofencing &amp; Buzzer Triggers</text>
      <line x1="16" y1="98" x2="268" y2="98" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="112" class="c-sub">CONNECTED TELEMETRY FIRMWARE</text>
    </g>

    <!-- Box 6: 06 DEVOPS & TOOLS -->
    <g transform="translate(604, 0)">
      <rect width="284" height="126" rx="8" fill="url(#box-burgundy)" stroke="url(#card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#E5B5C7;#9E1B54" dur="5.6s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Beacon -->
      <circle cx="16" cy="18" r="3" fill="#E5B5C7">
        <animate attributeName="r" values="2.4; 3.6; 2.4" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="c-head">06 · WORKFLOWS &amp; TOOLS</text>
      <text x="16" y="46" class="c-item">Git · GitHub · GitHub Desktop</text>
      <text x="16" y="66" class="c-item">n8n Automation Pipelines</text>
      <text x="16" y="86" class="c-item">Render Cloud · VS Code</text>
      <line x1="16" y1="98" x2="268" y2="98" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="112" class="c-sub">CI/CD &amp; AUTOMATED PIPELINES</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="938" height="368" rx="13" fill="none" stroke="url(#tool-border)" stroke-width="1.2"/>
</svg>
