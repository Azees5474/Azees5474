<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="auto" role="img" aria-label="Terminal — About Ajies S.">
  <defs>
    <!-- Background Gradient: Rich Dark Shade of Burgundy -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140510"/>
      <stop offset="35%" stop-color="#230A1B"/>
      <stop offset="65%" stop-color="#2D0D22"/>
      <stop offset="100%" stop-color="#160512"/>
    </linearGradient>

    <!-- Glowing Outer Border Gradient -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E1B54" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#451126" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9E1B54" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Sub-card Border Gradient -->
    <linearGradient id="term-card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B54" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5A122E" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Bottom Neon Underglow Gradient (As Seen in Attached Photo) -->
    <radialGradient id="term-underglow" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#A81D58" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#3D0B20" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#140510" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="term-ambient-glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5A122E" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#350E22" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#140510" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Scanning Laser -->
    <linearGradient id="term-top-scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1">
        <animate attributeName="offset" values="-0.5; 1.0" dur="3.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#9E1B54" stop-opacity="0.7">
        <animate attributeName="offset" values="-0.2; 1.3" dur="3.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95">
        <animate attributeName="offset" values="0.0; 1.5" dur="3.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0.2; 1.7" dur="3.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1">
        <animate attributeName="offset" values="0.5; 2.0" dur="3.8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="term-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#701A3D" opacity="0.4"/>
    </pattern>

    <!-- Underglow Blur Filter -->
    <filter id="term-ground-blur" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <style>
    .t-mono {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
    }
    .t-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
    }
    .line-no {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #8A1F4A;
    }
    .code-comment {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #C77B9B;
      letter-spacing: 1px;
    }
    .code-val {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      fill: #F8F0F3;
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform {
        animation: none !important;
      }
    }
  </style>

  <!-- 0. Radiant Neon Underglow (Spills Downward Like Attached Photo) -->
  <g transform="translate(470, 280)" filter="url(#term-ground-blur)">
    <ellipse cx="0" cy="0" rx="420" ry="20" fill="url(#term-underglow)">
      <animate attributeName="rx" values="390; 435; 390" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7; 1.0; 0.7" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 1. Background Shell (Rich Dark Burgundy) -->
  <rect width="940" height="280" rx="14" fill="url(#term-bg)"/>
  <rect width="940" height="280" rx="14" fill="url(#term-ambient-glow)">
    <animate attributeName="opacity" values="0.6;0.95;0.6" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="936" height="276" rx="12" fill="url(#term-grid)" opacity="0.65"/>

  <!-- 2. Window Header Bar -->
  <rect width="940" height="38" rx="14" fill="#250918"/>
  <rect x="0" y="24" width="940" height="14" fill="#250918"/>
  <line x1="0" y1="38" x2="940" y2="38" stroke="#5A122E" stroke-width="1.2"/>

  <!-- Scanning Laser Across Header Line -->
  <line x1="0" y1="38" x2="940" y2="38" stroke="url(#term-top-scan)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Window Controls with Pulsing Status Beacon -->
  <circle cx="24" cy="19" r="4.5" fill="#8A1F4A"/>
  <circle cx="38" cy="19" r="4.5" fill="#C77B9B" opacity="0.85"/>
  <circle cx="52" cy="19" r="4.5" fill="#E5B5C7" opacity="0.75"/>

  <!-- Tab Label -->
  <text x="74" y="23" class="t-mono" font-size="11" font-weight="600" fill="#E5B5C7" letter-spacing="1.2">
    ajies@terminal: ~ <tspan fill="#C77B9B">(zsh)</tspan>
  </text>

  <!-- Right Metadata with Pulsing Live Status Dot -->
  <g transform="translate(780, 19)">
    <circle cx="0" cy="0" r="3" fill="#C77B9B">
      <animate attributeName="r" values="2.5; 4.2; 2.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="3.5" class="t-mono" font-size="9.5" fill="#C77B9B" letter-spacing="1.5">
      SYSTEM.ENV // READY
    </text>
  </g>

  <!-- 3. Left Pane: Terminal Code Lines -->
  <g transform="translate(24, 66)">
    <!-- Line 1 -->
    <text x="0" y="0" class="line-no">01</text>
    <text x="32" y="0" class="code-comment">// ORIGIN &amp; IDENTITY</text>

    <!-- Line 2 -->
    <text x="0" y="24" class="line-no">02</text>
    <text x="32" y="24" class="code-val">Application Developer <tspan fill="#C77B9B">|</tspan> Front-End Developer</text>

    <!-- Line 3 -->
    <text x="0" y="52" class="line-no">03</text>
    <text x="32" y="52" class="code-comment">// ARCHITECTURAL SPECIALIZATION</text>

    <!-- Line 4 -->
    <text x="0" y="76" class="line-no">04</text>
    <text x="32" y="76" class="code-val">Web Applications <tspan fill="#701A3D">·</tspan> Offline-First Desktop <tspan fill="#701A3D">·</tspan> IoT Telemetry</text>

    <!-- Line 5 -->
    <text x="0" y="104" class="line-no">05</text>
    <text x="32" y="104" class="code-comment">// CORE DISCIPLINES</text>

    <!-- Line 6 -->
    <text x="0" y="128" class="line-no">06</text>
    <text x="32" y="128" class="code-val">React <tspan fill="#C77B9B">·</tspan> TypeScript <tspan fill="#C77B9B">·</tspan> Electron <tspan fill="#C77B9B">·</tspan> Python <tspan fill="#C77B9B">·</tspan> ESP32</text>

    <!-- Line 7 -->
    <text x="0" y="156" class="line-no">07</text>
    <text x="32" y="156" class="code-comment">// ENGINEERING PHILOSOPHY</text>

    <!-- Line 8 with Blinking Terminal Cursor -->
    <text x="0" y="180" class="line-no">08</text>
    <text x="32" y="180" class="code-val">Resilient state handling, high performance, and intuitive UI</text>
    <!-- Blinking Cursor -->
    <rect x="495" y="169" width="7.5" height="13" fill="#E5B5C7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Vertical Divider with subtle pulse -->
  <line x1="620" y1="52" x2="620" y2="262" stroke="#5A122E" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- 4. Right Pane: Two High-Tech HUD Capability Cards with Breathing Burgundy Borders -->
  <g transform="translate(642, 58)">
    <!-- Card 1: Front-End & Desktop -->
    <g transform="translate(0, 0)">
      <rect width="270" height="96" rx="8" fill="#280C1E" stroke="url(#term-card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#C77B9B;#9E1B54" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Dot -->
      <circle cx="16" cy="18" r="3" fill="#C77B9B">
        <animate attributeName="r" values="2.5; 3.8; 2.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="t-mono" font-size="9.5" font-weight="700" fill="#E5B5C7" letter-spacing="1.5">
        FRONT-END &amp; DESKTOP
      </text>
      <text x="16" y="48" class="t-sans" font-size="14" font-weight="700" fill="#F8F0F3">
        React · TypeScript · Electron
      </text>
      <text x="16" y="68" class="t-sans" font-size="11" fill="#C77B9B">
        Responsive UI · Vite · Node.js APIs
      </text>
      <line x1="16" y1="78" x2="254" y2="78" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="89" class="t-mono" font-size="8" fill="#E5B5C7" opacity="0.85" letter-spacing="1">
        OFFLINE-FIRST ARCHITECTURE
      </text>
    </g>

    <!-- Card 2: AI & Connected Hardware -->
    <g transform="translate(0, 108)">
      <rect width="270" height="96" rx="8" fill="#280C1E" stroke="url(#term-card-border)" stroke-width="1.2">
        <animate attributeName="stroke" values="#9E1B54;#E5B5C7;#9E1B54" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Pulsing Dot -->
      <circle cx="16" cy="18" r="3" fill="#E5B5C7">
        <animate attributeName="r" values="2.5; 3.8; 2.5" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="21" class="t-mono" font-size="9.5" font-weight="700" fill="#E5B5C7" letter-spacing="1.5">
        AI &amp; HARDWARE SYSTEMS
      </text>
      <text x="16" y="48" class="t-sans" font-size="14" font-weight="700" fill="#F8F0F3">
        LangChain · RAG · ESP32 IoT
      </text>
      <text x="16" y="68" class="t-sans" font-size="11" fill="#C77B9B">
        Vector Store · GPS · Geofencing C++
      </text>
      <line x1="16" y1="78" x2="254" y2="78" stroke="#5A122E" stroke-width="0.8"/>
      <text x="16" y="89" class="t-mono" font-size="8" fill="#E5B5C7" opacity="0.85" letter-spacing="1">
        INTELLIGENT &amp; CONNECTED SYSTEMS
      </text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="938" height="278" rx="13" fill="none" stroke="url(#term-border)" stroke-width="1.2"/>
</svg>
